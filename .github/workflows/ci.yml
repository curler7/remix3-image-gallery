name: Full test suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      UPDATE_VISUALS: "0"
      FONTCONFIG_FILE: ${{ github.workspace }}/.github/fonts.conf
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Prepare clean reports
        run: |
          rm -rf artifacts
          mkdir -p artifacts/ci
      - name: Install locked dependencies
        run: npm ci 2>&1 | tee artifacts/ci/install.log
      - name: Install all browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit 2>&1 | tee artifacts/ci/browsers.log
      - name: Install consistent visual-test fonts
        run: |
          sudo apt-get install -y fonts-noto-core 2>&1 | tee artifacts/ci/fonts.log
          fc-match Georgia | tee -a artifacts/ci/fonts.log
          fc-match sans-serif | tee -a artifacts/ci/fonts.log
      - name: Run all checks, browser regressions and benchmarks
        run: npm run test:ci
      - name: Upload reports, screenshots and visual diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**/*.json
            artifacts/**/*.log
            artifacts/**/*.png
            tests/visual/**/*.png
          if-no-files-found: warn
          retention-days: 14
